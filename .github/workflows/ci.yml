name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev

      # CMakeLists.txt adds -Wall -Wextra; warnings fail the build here.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run on the sample video
        run: ./build/curvetool --no-gui --curve 0:0,128:191,255:255 --out output/barriers_curves.avi --images output barriers.avi
